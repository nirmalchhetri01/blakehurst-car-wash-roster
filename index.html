<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blakehurst Car Wash - Staff Roster</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f8fc;color:#17232d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#0077c8,#005ea8);color:white;padding:20px 14px}
h1{margin:0;font-size:22px}.sub{opacity:.9;margin-top:3px}
.top{display:flex;align-items:center;justify-content:space-between;margin-top:15px;gap:8px}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:700}
.nav{background:#ffffff25;color:white}.week{font-size:13px;text-align:center}
.add{margin-top:10px;background:white;color:#005ea8}
main{padding:12px;max-width:1200px;margin:auto}
.card{background:white;border-radius:16px;overflow:auto;box-shadow:0 2px 10px #1232}
table{border-collapse:collapse;width:100%;min-width:760px}
th{background:#eaf6ff;color:#31566e;font-size:12px;padding:10px}
td{border-top:1px solid #dce6ee;padding:8px;text-align:center}
.name{font-weight:800;text-align:left;position:sticky;left:0;background:white;min-width:145px}
.time{background:white;border:1px solid #d7e5ee;color:#17435d;min-width:82px}
.off{background:#f0f2f3;color:#89939a}
.actions button{padding:5px 7px;font-size:11px;background:#eaf6ff;color:#005ea8;margin-left:3px}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#0077c8,#005ea8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.loginbox{background:white;padding:24px;border-radius:20px;width:100%;max-width:400px}
.loginbox h2{margin:0 0 5px}.loginbox p{color:#667}
input{width:100%;padding:13px;margin:6px 0;border:1px solid #ccd9e1;border-radius:10px;font-size:16px}
.loginbtn{width:100%;background:#0077c8;color:white;margin-top:8px}
#err{color:#b42318;font-size:13px;margin-top:8px}
.empty{text-align:center;padding:35px;color:#687780}
.modal{position:fixed;inset:0;background:#00243c88;display:none;align-items:flex-end;z-index:10}
.sheet{background:white;width:100%;padding:20px;border-radius:20px 20px 0 0}
.sheet h3{margin-top:0}.row{display:flex;gap:8px}.row button{flex:1}
.blue{background:#0077c8;color:white}.gray{background:#edf1f3}.red{background:#fdecec;color:#a32020}
@media(min-width:700px){.modal{align-items:center}.sheet{max-width:430px;margin:auto;border-radius:20px}}
</style>
</head>
<body>

<div id="login">
<div class="loginbox">
<h2>Blakehurst Car Wash</h2>
<p>Staff Roster - Admin Login</p>
<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button class="loginbtn" onclick="login()">Sign in</button>
<div id="err"></div>
</div>
</div>

<header>
<h1>Blakehurst Car Wash</h1>
<div class="sub">Staff Roster</div>
<div class="top">
<button class="nav" onclick="moveWeek(-7)">‹</button>
<div class="week" id="week"></div>
<button class="nav" onclick="moveWeek(7)">›</button>
</div>
<div><button class="add" onclick="addStaff()">＋ Add Staff</button>
<button class="nav" onclick="logout()">Log out</button></div>
</header>

<main>
<div class="card"><table id="table"></table></div>
</main>

<div class="modal" id="modal">
<div class="sheet">
<h3 id="modalTitle">Set shift</h3>
<input id="time" type="time">
<div class="row">
<button class="gray" onclick="closeModal()">Cancel</button>
<button class="gray" onclick="setOff()">OFF</button>
<button class="blue" onclick="saveTime()">Save</button>
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyCNnCJySpatR3p4cL7pT152cmSfUCEpREk",
authDomain:"blakehurst-car-wash.firebaseapp.com",
projectId:"blakehurst-car-wash",
storageBucket:"blakehurst-car-wash.firebasestorage.app",
messagingSenderId:"352439384369",
appId:"1:352439384369:web:ad7dacc434b1793b365810"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const ref=db.collection("roster").doc("main");

let start=monday(new Date()),data={staff:[]},current={i:-1,k:""};

function monday(d){
 d=new Date(d);d.setHours(0,0,0,0);
 d.setDate(d.getDate()-((d.getDay()+6)%7));return d
}
function dates(){
 return Array.from({length:7},(_,i)=>{
  let d=new Date(start);d.setDate(d.getDate()+i);return d
 })
}
function key(d){return d.toISOString().slice(0,10)}
function label(v){
 if(!v)return"OFF";
 let a=v.split(":").map(Number),h=a[0],m=a[1];
 return(h%12||12)+":"+String(m).padStart(2,"0")+" "+(h>=12?"PM":"AM")
}
function render(){
 let ds=dates();
 week.textContent=ds[0].toLocaleDateString("en-AU",{day:"numeric",month:"short"})+
 " – "+ds[6].toLocaleDateString("en-AU",{day:"numeric",month:"short"});
 let x="<tr><th>Staff</th>";
 ds.forEach(d=>x+="<th>"+d.toLocaleDateString("en-AU",{weekday:"short"})+
 "<br>"+d.getDate()+"/"+(d.getMonth()+1)+"</th>");
 x+="</tr>";
 if(!data.staff.length)x+='<tr><td colspan="8" class="empty">No staff yet. Tap Add Staff.</td></tr>';
 data.staff.forEach((s,i)=>{
  x+="<tr><td class=name>"+s.name+
  '<span class=actions><button onclick="editName('+i+')">Edit</button>'+
  '<button onclick="removeStaff('+i+')">×</button></span></td>';
  ds.forEach(d=>{
   let k=key(d),v=(s.schedule||{})[k]||"";
   x+='<td><button class="time '+(!v?"off":"")+
   '" onclick="shift('+i+',\''+k+'\')">'+label(v)+"</button></td>";
  });
  x+="</tr>";
 });
 table.innerHTML=x;
}
async function load(){
 let s=await ref.get();
 if(s.exists)data=s.data();
 else await ref.set(data);
 render();
}
function moveWeek(n){start.setDate(start.getDate()+n);render()}
async function login(){
 err.textContent="";
 try{await auth.signInWithEmailAndPassword(email.value.trim(),pass.value)}
 catch(e){err.textContent="Incorrect email or password."}
}
function logout(){auth.signOut()}
function addStaff(){
 let n=prompt("Staff name:");
 if(n&&n.trim()){data.staff.push({name:n.trim(),schedule:{}});save()}
}
function editName(i){
 let n=prompt("Staff name:",data.staff[i].name);
 if(n&&n.trim()){data.staff[i].name=n.trim();save()}
}
function removeStaff(i){
 if(confirm("Remove "+data.staff[i].name+"?")){
  data.staff.splice(i,1);save()
 }
}
function shift(i,k){
 current={i,k};
 modalTitle.textContent=data.staff[i].name+" — "+k;
 time.value=data.staff[i].schedule?.[k]||"";
 modal.style.display="flex";
}
function closeModal(){modal.style.display="none"}
async function saveTime(){
 let v=time.value;
 if(!v)return;
 if(!data.staff[current.i].schedule)data.staff[current.i].schedule={};
 data.staff[current.i].schedule[current.k]=v;
 closeModal();await save()
}
async function setOff(){
 if(!data.staff[current.i].schedule)data.staff[current.i].schedule={};
 delete data.staff[current.i].schedule[current.k];
 closeModal();await save()
}
async function save(){await ref.set(data);render()}
auth.onAuthStateChanged(async u=>{
 login.style.display=u?"none":"flex";
 if(u)try{await load()}catch(e){err.textContent="Database access error."}
});
</script>
</body>
</html>
