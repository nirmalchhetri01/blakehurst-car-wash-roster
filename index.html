<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blakehurst Car Wash - Staff Roster</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f8fc;
color:#17232d;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
background:linear-gradient(135deg,#0077c8,#005ea8);
color:white;
padding:20px 14px;
}

h1{
margin:0;
font-size:22px;
}

.sub{
opacity:.9;
margin-top:3px;
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:15px;
gap:8px;
}

button{
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:700;
font-size:14px;
}

.nav{
background:rgba(255,255,255,.18);
color:white;
}

.week{
font-size:13px;
text-align:center;
}

.add{
margin-top:10px;
background:white;
color:#005ea8;
}

.logout{
margin-top:10px;
background:rgba(255,255,255,.18);
color:white;
margin-left:6px;
}

main{
padding:12px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
border-radius:16px;
overflow:auto;
box-shadow:0 2px 10px rgba(18,50,80,.15);
}

table{
border-collapse:collapse;
width:100%;
min-width:760px;
}

th{
background:#eaf6ff;
color:#31566e;
font-size:12px;
padding:10px;
}

td{
border-top:1px solid #dce6ee;
padding:8px;
text-align:center;
}

.name{
font-weight:800;
text-align:left;
position:sticky;
left:0;
background:white;
min-width:160px;
}

.time{
background:white;
border:1px solid #d7e5ee;
color:#17435d;
min-width:82px;
}

.off{
background:#f0f2f3;
color:#89939a;
}

.actions button{
padding:5px 7px;
font-size:11px;
background:#eaf6ff;
color:#005ea8;
margin-left:3px;
}

.empty{
padding:30px;
color:#777;
}

/* LOGIN */

#loginScreen{
position:fixed;
inset:0;
background:linear-gradient(135deg,#0077c8,#005ea8);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:20;
}

.loginbox{
background:white;
padding:24px;
border-radius:20px;
width:100%;
max-width:400px;
}

.loginbox h2{
margin:0 0 5px;
}

.loginbox p{
color:#667;
}

input{
width:100%;
padding:13px;
margin:6px 0;
border:1px solid #ccd9e1;
border-radius:10px;
font-size:16px;
}

.loginbtn{
width:100%;
background:#0077c8;
color:white;
margin-top:8px;
}

#loginError{
color:#b42318;
font-size:13px;
margin-top:8px;
}

/* ROLE LABEL */

.role{
display:none;
margin-top:10px;
font-size:12px;
background:rgba(255,255,255,.15);
padding:6px 10px;
border-radius:8px;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,36,60,.55);
display:none;
align-items:flex-end;
z-index:30;
}

.sheet{
background:white;
width:100%;
padding:20px;
border-radius:20px 20px 0 0;
}

.sheet h3{
margin-top:0;
}

.row{
display:flex;
gap:8px;
}

.row button{
flex:1;
}

.blue{
background:#0077c8;
color:white;
}

.gray{
background:#edf1f3;
}

@media(min-width:700px){

.modal{
align-items:center;
}

.sheet{
max-width:430px;
margin:auto;
border-radius:20px;
}

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

<div class="loginbox">

<h2>Blakehurst Car Wash</h2>

<p>Staff Roster</p>

<input
id="loginId"
type="text"
placeholder="Staff ID or Email"
autocomplete="username"
>

<input
id="loginPassword"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button
id="loginButton"
class="loginbtn">
Sign in
</button>

<div id="loginError"></div>

</div>

</div>


<!-- HEADER -->

<header>

<h1>Blakehurst Car Wash</h1>

<div class="sub">
Staff Roster
</div>

<div id="roleLabel" class="role"></div>

<div class="top">

<button id="previousWeek" class="nav">
‹
</button>

<div id="weekLabel" class="week">
Loading...
</div>

<button id="nextWeek" class="nav">
›
</button>

</div>

<div id="adminControls">

<button id="addStaffButton" class="add">
＋ Add Staff
</button>

<button id="logoutButton" class="logout">
Log out
</button>

</div>

<div id="staffControls" style="display:none">

<button id="staffLogoutButton" class="logout">
Log out
</button>

</div>

</header>


<!-- ROSTER -->

<main>

<div class="card">

<table id="rosterTable"></table>

</div>

</main>


<!-- SHIFT MODAL -->

<div id="shiftModal" class="modal">

<div class="sheet">

<h3 id="modalTitle">
Set shift
</h3>

<input
id="timeInput"
type="time"
>

<div class="row">

<button
id="cancelButton"
class="gray">
Cancel
</button>

<button
id="offButton"
class="gray">
OFF
</button>

<button
id="saveTimeButton"
class="blue">
Save
</button>

</div>

</div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>


<script>

/* ============================
   FIREBASE CONFIG
   ============================ */

const firebaseConfig={

apiKey:"AIzaSyCNnCJySpatR3p4cL7pT152cmSfUCEpREk",

authDomain:"blakehurst-car-wash.firebaseapp.com",

projectId:"blakehurst-car-wash",

storageBucket:"blakehurst-car-wash.firebasestorage.app",

messagingSenderId:"352439384369",

appId:"1:352439384369:web:ad7dacc434b1793b365810"

};


firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();

const db=firebase.firestore();

const rosterRef=
db.collection("roster").doc("main");


/* ============================
   STAFF LOGIN
   ============================ */

const STAFF_ID="staff";

const STAFF_EMAIL=
"staff@blakehurstcarwash.com";

const STAFF_PASSWORD="Crystal";


/*
IMPORTANT:

The Firebase staff account must have:

Email:
staff@blakehurstcarwash.com

Password:
Crystal
*/


/* ============================
   APPLICATION STATE
   ============================ */

let startDate=
getMonday(new Date());

let rosterData={
staff:[]
};

let currentShift={
staffIndex:-1,
dateKey:""
};

let currentRole="";


/* ============================
   ELEMENTS
   ============================ */

const loginScreen=
document.getElementById("loginScreen");

const loginId=
document.getElementById("loginId");

const loginPassword=
document.getElementById("loginPassword");

const loginButton=
document.getElementById("loginButton");

const loginError=
document.getElementById("loginError");

const weekLabel=
document.getElementById("weekLabel");

const rosterTable=
document.getElementById("rosterTable");

const shiftModal=
document.getElementById("shiftModal");

const modalTitle=
document.getElementById("modalTitle");

const timeInput=
document.getElementById("timeInput");

const adminControls=
document.getElementById("adminControls");

const staffControls=
document.getElementById("staffControls");

const roleLabel=
document.getElementById("roleLabel");


/* ============================
   DATE FUNCTIONS
   ============================ */

function getMonday(date){

const d=new Date(date);

d.setHours(0,0,0,0);

const day=d.getDay();

const difference=(day+6)%7;

d.setDate(
d.getDate()-difference
);

return d;

}


function getWeekDates(){

const dates=[];

for(let i=0;i<7;i++){

const d=new Date(startDate);

d.setDate(
d.getDate()+i
);

dates.push(d);

}

return dates;

}


function dateKey(date){

const year=date.getFullYear();

const month=
String(date.getMonth()+1)
.padStart(2,"0");

const day=
String(date.getDate())
.padStart(2,"0");

return year+"-"+month+"-"+day;

}


/* ============================
   TIME
   ============================ */

function formatTime(value){

if(!value){
return "OFF";
}

const parts=value.split(":");

let hour=Number(parts[0]);

const minute=parts[1];

const suffix=
hour>=12?"PM":"AM";

hour=hour%12||12;

return hour+":"+minute+" "+suffix;

}


/* ============================
   HTML ESCAPE
   ============================ */

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* ============================
   RENDER ROSTER
   ============================ */

function renderRoster(){

const dates=getWeekDates();

const firstDate=dates[0];

const lastDate=dates[6];


weekLabel.textContent=

firstDate.toLocaleDateString(
"en-AU",
{
day:"numeric",
month:"short"
}
)

+" – "+

lastDate.toLocaleDateString(
"en-AU",
{
day:"numeric",
month:"short"
}
);


let html="<tr>";

html+="<th>Staff</th>";


dates.forEach(function(date){

html+=
"<th>"+

date.toLocaleDateString(
"en-AU",
{
weekday:"short"
}
)

+"<br>"+

date.getDate()+"/"+

(date.getMonth()+1)+

"</th>";

});


html+="</tr>";


if(
!rosterData.staff ||
rosterData.staff.length===0
){

html+=
'<tr><td colspan="8" class="empty">'+
"No staff yet. "+
(
currentRole==="admin"
?"Tap Add Staff."
:"No staff have been added."
)+
"</td></tr>";

rosterTable.innerHTML=html;

return;

}


/* STAFF ROWS */

rosterData.staff.forEach(
function(staff,index){

html+="<tr>";

/* STAFF NAME */

html+=
'<td class="name">'+
escapeHtml(staff.name);


/* ADMIN ONLY BUTTONS */

if(currentRole==="admin"){

html+=
'<span class="actions">'+

'<button onclick="editStaffName('+
index+
')">Edit</button>'+

'<button onclick="removeStaff('+
index+
')">×</button>'+

"</span>";

}


html+="</td>";


/* DAYS */

dates.forEach(function(date){

const key=dateKey(date);

const value=
staff.schedule &&
staff.schedule[key]
?staff.schedule[key]
:"";


if(currentRole==="admin"){

/* ADMIN CAN EDIT */

html+=
"<td>"+

'<button class="time '+
(!value?"off":"")+
'" onclick="openShift('+
index+
",'"+
key+
"')\">"+

formatTime(value)+

"</button>"+

"</td>";

}else{

/* STAFF VIEW ONLY */

html+=
"<td>"+

'<span class="time '+
(!value?"off":"")+
'" style="display:inline-block;padding:10px 8px;border-radius:10px;">'+

formatTime(value)+

"</span>"+

"</td>";

}

});


html+="</tr>";

});


rosterTable.innerHTML=html;

}


/* ============================
   LOAD ROSTER
   ============================ */

async function loadRoster(){

try{

const snapshot=
await rosterRef.get();


if(snapshot.exists){

const saved=snapshot.data();

rosterData={

staff:
Array.isArray(saved.staff)
?saved.staff
:[]

};

}else{

rosterData={
staff:[]
};

if(currentRole==="admin"){

await rosterRef.set(
rosterData
);

}

}


renderRoster();

}catch(error){

console.error(
"Firestore error:",
error
);

loginError.textContent=
"Database could not be loaded.";

}

}


/* ============================
   SAVE
   ============================ */

async function saveRoster(){

if(currentRole!=="admin"){

return;

}


try{

await rosterRef.set(
rosterData
);

renderRoster();

}catch(error){

console.error(
"Save error:",
error
);

alert(
"Could not save the roster."
);

}

}


/* ============================
   LOGIN
   ============================ */

async function doLogin(){

loginError.textContent="";

const enteredId=
loginId.value.trim();

const password=
loginPassword.value;


if(!enteredId || !password){

loginError.textContent=
"Please enter your Staff ID and password.";

return;

}


loginButton.disabled=true;

loginButton.textContent=
"Signing in...";


let email=enteredId;


/*
If user enters:

staff

convert it to:

staff@blakehurstcarwash.com
*/

if(
enteredId.toLowerCase()===
STAFF_ID
){

email=STAFF_EMAIL;

}


try{

await auth.signInWithEmailAndPassword(
email,
password
);

}catch(error){

console.error(
"Login error:",
error
);

loginError.textContent=
"Incorrect Staff ID/email or password.";

loginButton.disabled=false;

loginButton.textContent=
"Sign in";

}

}


/* ============================
   LOGOUT
   ============================ */

function logout(){

auth.signOut();

}


/* ============================
   ADD STAFF
   ============================ */

async function addStaff(){

if(currentRole!=="admin"){
return;
}


const name=
prompt("Enter staff name:");


if(name && name.trim()){

rosterData.staff.push({

name:name.trim(),

schedule:{}

});


await saveRoster();

}

}


/* ============================
   EDIT STAFF
   ============================ */

async function editStaffName(index){

if(currentRole!=="admin"){
return;
}


const currentName=
rosterData.staff[index].name;


const newName=
prompt(
"Staff name:",
currentName
);


if(newName && newName.trim()){

rosterData.staff[index].name=
newName.trim();

await saveRoster();

}

}


/* ============================
   REMOVE STAFF
   ============================ */

async function removeStaff(index){

if(currentRole!=="admin"){
return;
}


const name=
rosterData.staff[index].name;


if(
!confirm(
"Remove "+name+" from the roster?"
)
){

return;

}


rosterData.staff.splice(
index,
1
);

await saveRoster();

}


/* ============================
   OPEN SHIFT
   ============================ */

function openShift(index,key){

if(currentRole!=="admin"){
return;
}


currentShift={

staffIndex:index,

dateKey:key

};


const staff=
rosterData.staff[index];


modalTitle.textContent=
staff.name+" — "+key;


const existing=
staff.schedule &&
staff.schedule[key]
?staff.schedule[key]
:"";


timeInput.value=existing;

shiftModal.style.display="flex";

}


/* ============================
   CLOSE MODAL
   ============================ */

function closeShiftModal(){

shiftModal.style.display="none";

}


/* ============================
   SAVE TIME
   ============================ */

async function saveTime(){

if(currentRole!=="admin"){
return;
}


const value=
timeInput.value;


if(!value){

alert(
"Please choose a time or select OFF."
);

return;

}


const staff=
rosterData.staff[
currentShift.staffIndex
];


if(!staff.schedule){

staff.schedule={};

}


staff.schedule[
currentShift.dateKey
]=value;


closeShiftModal();

await saveRoster();

}


/* ============================
   OFF
   ============================ */

async function setOff(){

if(currentRole!=="admin"){
return;
}


const staff=
rosterData.staff[
currentShift.staffIndex
];


if(!staff.schedule){

staff.schedule={};

}


delete staff.schedule[
currentShift.dateKey
];


closeShiftModal();

await saveRoster();

}


/* ============================
   WEEK NAVIGATION
   ============================ */

function moveWeek(days){

startDate.setDate(
startDate.getDate()+days
);

renderRoster();

}


/* ============================
   BUTTONS
   ============================ */

loginButton.addEventListener(
"click",
doLogin
);


document
.getElementById("logoutButton")
.addEventListener(
"click",
logout
);


document
.getElementById("staffLogoutButton")
.addEventListener(
"click",
logout
);


document
.getElementById("addStaffButton")
.addEventListener(
"click",
addStaff
);


document
.getElementById("previousWeek")
.addEventListener(
"click",
function(){

moveWeek(-7);

}
);


document
.getElementById("nextWeek")
.addEventListener(
"click",
function(){

moveWeek(7);

}
);


document
.getElementById("cancelButton")
.addEventListener(
"click",
closeShiftModal
);


document
.getElementById("offButton")
.addEventListener(
"click",
setOff
);


document
.getElementById("saveTimeButton")
.addEventListener(
"click",
saveTime
);


/* ============================
   AUTH STATE
   ============================ */

auth.onAuthStateChanged(
async function(user){

if(user){

/*
Determine user role
*/

if(
user.email.toLowerCase()===
STAFF_EMAIL.toLowerCase()
){

currentRole="staff";

}else{

currentRole="admin";

}


/* Hide login */

loginScreen.style.display="none";


/* Show correct controls */

if(currentRole==="admin"){

adminControls.style.display="block";

staffControls.style.display="none";

roleLabel.style.display="inline-block";

roleLabel.textContent=
"Administrator — Full Access";

}else{

adminControls.style.display="none";

staffControls.style.display="block";

roleLabel.style.display="inline-block";

roleLabel.textContent=
"Staff — View Only";

}


/* Load roster */

await loadRoster();


}else{

currentRole="";

loginScreen.style.display="flex";

adminControls.style.display="none";

staffControls.style.display="none";

roleLabel.style.display="none";

loginButton.disabled=false;

loginButton.textContent="Sign in";

}

});


/* Initial display */

renderRoster();

</script>

</body>
</html>
